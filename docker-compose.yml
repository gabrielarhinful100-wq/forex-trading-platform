version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: forexpro-db
    environment:
      POSTGRES_USER: forex_user
      POSTGRES_PASSWORD: forex_password
      POSTGRES_DB: forexpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forex_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forexpro-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default:
    name: forexpro-network
